<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тестова майстерня · МОВОСВІТ</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#25445b,#0a1221 65%);color:#f3f7ff;font:16px/1.6 system-ui,Arial,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:22px}a{color:#74e7d3}header{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.hero,.panel{background:#15273d;border:1px solid #38546a;border-radius:22px;padding:25px;margin:15px 0}.hero{background:linear-gradient(110deg,#164b55,#1b2848)}h1{font-size:clamp(2rem,5vw,3rem);margin:0}.muted{color:#c1d1e1}.grades{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.grades button{cursor:pointer;background:#1d3850;color:white;border:1px solid #4a667d;border-radius:12px;padding:10px 16px;font:inherit}.grades button[aria-pressed=true]{background:#6ee3d0;color:#082330;font-weight:800}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{border:1px solid #456277;border-radius:16px;padding:20px;background:#1c3349}.card h3{margin:0 0 8px}.button{display:inline-block;text-decoration:none;background:#74e7d3;color:#082330;font-weight:800;border-radius:12px;padding:10px 16px;margin-top:10px}.empty{padding:24px;border:1px dashed #688298;border-radius:15px}footer{color:#b5c6d6}@media print{body{background:white;color:black}header,.grades,.button{display:none}.hero,.panel,.card{background:white;color:black;border:1px solid #aaa}}</style></head><body><header><a href="../">← МОВОСВІТ</a><a href="../laboratory/">⚗️ Повернутися до Мовної лабораторії</a></header><main><section class="hero"><div style="font-size:2.3rem">📝</div><h1>Тестова майстерня</h1><p>Українська мова · 5–9 класи</p><p class="muted">Обирайте клас і тему. Проходьте тести, перевіряйте знання та друкуйте матеріали.</p></section><section class="panel"><h2>Оберіть клас</h2><div class="grades" role="group" aria-label="Клас"><button aria-pressed="true" data-grade="5">5 клас</button><button aria-pressed="false" data-grade="6">6 клас</button><button aria-pressed="false" data-grade="7">7 клас</button><button aria-pressed="false" data-grade="8">8 клас</button><button aria-pressed="false" data-grade="9">9 клас</button></div><div id="content" aria-live="polite"></div></section></main><footer>МОВОСВІТ · Тестова майстерня</footer><script>const content=document.getElementById('content');function show(g){document.querySelectorAll('[data-grade]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.grade===g)));content.innerHTML=g==='5'?'<div class="cards"><article class="card"><h3>Словосполучення</h3><p class="muted">13 завдань · Інтерактивний тест</p><a class="button" href="slovospoluchennia/">Відкрити тест →</a></article></div>':g==='6'?'<div class="cards"><article class="card"><h3>Лексикологія. Фразеологія</h3><p class="muted">24 завдання · Автоматична перевірка · 12-бальна шкала</p><a class="button" href="leksykolohiia-frazeolohiia/">Розпочати тест →</a></article></div>':'<div class="empty">Тести для '+g+' класу будуть додані згодом.</div>'}document.querySelectorAll('[data-grade]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.grade)));show('5');</script></body></html>
