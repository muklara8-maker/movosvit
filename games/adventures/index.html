<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Інтерактивні мовні пригоди — МОВОСВІТ</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:#f4faff;background:radial-gradient(ellipse at top,#164567,#071a34 70%);min-height:100vh}header{padding:17px max(20px,calc((100vw - 1100px)/2));background:#06172e;border-bottom:2px solid #e7b94d;display:flex;gap:22px;flex-wrap:wrap;align-items:center}header strong{color:#ffda76;font-size:21px}a{color:#b7f1f3}main{max-width:1100px;margin:auto;padding:32px 18px 70px}.intro{background:#102e50;border:1px solid #3288a2;border-radius:24px;padding:clamp(20px,5vw,45px);box-shadow:0 12px 35px #0005}.eyebrow{color:#ffda76;letter-spacing:.1em;font-size:13px;font-weight:800}h1{font-size:clamp(30px,5vw,49px);margin:10px 0}p{line-height:1.6;color:#d0e8f2}.grades{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}.grades button{background:#17466b;color:white;border:1px solid #49a7b8;border-radius:12px;padding:13px 21px;font:700 17px system-ui;cursor:pointer;min-height:50px}.grades button.active{background:#f8c95d;color:#0a2340;border-color:#ffeaa0}.grades button:focus-visible,a:focus-visible{outline:3px solid #ffda76;outline-offset:3px}.collection{margin-top:26px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}.card{background:#102e50;border:1px solid #3288a2;border-radius:20px;overflow:hidden}.art{height:200px;background:linear-gradient(125deg,#154769,#123653);display:flex;align-items:center;justify-content:center;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.content{padding:22px}.content h3{font-size:24px;margin:4px 0 10px}.button{display:inline-block;text-decoration:none;background:#0c96aa;color:white;border:1px solid #6be1e9;border-radius:12px;padding:13px 20px;font-weight:800;margin-top:10px}.button:hover{background:#087789}.empty{border:1px dashed #47849d;border-radius:18px;padding:24px;background:#102d4b}footer{text-align:center;color:#a9cbd8;padding:24px;font-size:13px}@media(prefers-reduced-motion:no-preference){.card{transition:transform .2s}.card:hover{transform:translateY(-3px)}}@media(max-width:520px){main{padding:18px 12px 45px}.art{height:170px}}</style></head><body><header><strong>МОВОСВІТ</strong><a href="../">← Мовна ігротека</a><a href="../../">Головна</a></header><main><section class="intro"><div class="eyebrow">АВТОРСЬКА КОЛЕКЦІЯ · 5–9 КЛАСИ</div><h1>Інтерактивні мовні пригоди</h1><p>Кожна гра — нова історія. Досліджуй мовні світи, розв’язуй завдання та відкривай таємниці української мови. Обери свій клас, щоб почати подорож.</p></section><nav class="grades" aria-label="Вибір класу"><button type="button" data-grade="5">5 клас</button><button type="button" data-grade="6">6 клас</button><button type="button" data-grade="7">7 клас</button><button type="button" data-grade="8">8 клас</button><button type="button" data-grade="9">9 клас</button></nav><section class="collection" aria-live="polite"><h2 id="heading">Ігри для 7 класу</h2><div id="cards" class="cards"></div></section></main><footer>МОВОСВІТ · Створено © Лариса Мукомела</footer><script>const games=[{grade:7,title:'Таємниці Дієслова',description:'Дванадцять мовних маяків згасли. Пройди випробування та поверни словам силу дії!',url:'./taiemnytsi-diieslova/',image:'./taiemnytsi-diieslova/cover.webp'}];let grade=7;const buttons=[...document.querySelectorAll('[data-grade]')],cards=document.getElementById('cards');function render(){buttons.forEach(b=>{const active=Number(b.dataset.grade)===grade;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('heading').textContent='Ігри для '+grade+' класу';const items=games.filter(g=>g.grade===grade);cards.innerHTML=items.length?items.map(g=>'<article class="card"><div class="art"><img src="'+g.image+'" alt="Гірська долина, мовні маяки та загадкова бібліотека"></div><div class="content"><div class="eyebrow">'+g.grade+' КЛАС · 12 ВИПРОБУВАНЬ</div><h3>'+g.title+'</h3><p>'+g.description+'</p><a class="button" href="'+g.url+'">Розпочати пригоду →</a></div></article>').join(''):'<div class="empty"><h3>Нові пригоди незабаром</h3><p>Для цього класу колекція поки що порожня. Тут з’являться наступні авторські ігри.</p></div>'}buttons.forEach(b=>b.addEventListener('click',()=>{grade=Number(b.dataset.grade);render()}));render();</script></body></html>
