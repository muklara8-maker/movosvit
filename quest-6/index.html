const DATA={"name":"Експедиція до Королівства слів","grade":"6 клас","intro":"Королівська книга втратила дванадцять печаток. Вирушай на пошуки й поверни словам їхню силу.","stages":[{"title":"Брама забутих значень","topic":"Лексичне значення","story":"На кордоні Королівства слів мандрівників зустріла хранителька Брами. Вона повідомила: Королівська книга розсипалася на дванадцять печаток. Щоб відчинити браму, треба розпізнати значення слів.","questions":[{"q":"Яке слово має значення «той, хто створює художні твори»?","options":["митець","глядач","читач","слухач"],"answer":0,"explain":"Митець створює твори мистецтва."},{"q":"У якому рядку всі слова вжито в прямому значенні?","options":["золоте серце, гострий розум","теплий чай, дерев’яний стіл","солодка усмішка, кам’яне серце","срібний голос, легка вдача"],"answer":1,"explain":"Теплий чай і дерев’яний стіл — прямі значення."},{"q":"Яке слово є багатозначним?","options":["термометр","корінь","суфікс","кисень"],"answer":1,"explain":"Корінь може бути частиною рослини, слова тощо."},{"q":"У словосполученні «гострий розум» слово «гострий» ужито…","options":["у прямому значенні","у переносному значенні","як власну назву","як термін"],"answer":1,"explain":"«Гострий розум» — переносне значення."},{"q":"Яке слово найближче за значенням до «відважний»?","options":["боязкий","сміливий","сумний","повільний"],"answer":1,"explain":"Відважний — сміливий."}]},{"title":"Сад синонімів","topic":"Синоніми й антоніми","story":"У саду кожне дерево промовляє по-різному про те саме. Садівник просить знайти слова-друзі та слова-протилежності, щоб повернути барви квітам.","questions":[{"q":"Укажи синонім до слова «пильний».","options":["уважний","байдужий","сонний","швидкий"],"answer":0,"explain":"Пильний — уважний."},{"q":"Яка пара є антонімами?","options":["веселий — радісний","високий — низький","шлях — дорога","хоробрий — сміливий"],"answer":1,"explain":"Високий і низький — протилежні ознаки."},{"q":"У якому рядку подано синоніми?","option  запам’ятати","щось загубити","поспішати"],"answer":1,"explain":"Фразеологізм означає міцно запам’ятати."},{"q":"Який вислів означає «ледарювати»?","options":["бити байдики","брати ноги на плечі","тримати язик за зубами","пекти раків"],"answer":0,"explain":"Бити байдики — нічого не робити."},{"q":"«Як кіт наплакав» — це…","options":["дуже багато","дуже мало","дуже швидко","дуже голосно"],"answer":1,"explain":"Вислів означає дуже мало."},{"q":"Що означає «накивати п’ятами»?","options":["утекти","заснути","замислитися","заплакати"],"answer":0,"explain":"Накивати п’ятами — втекти."},{"q":"Який вислів означає «мовчати»?","options":["водити за ніс","тримати язик за зубами","ловити гав","пекти раків"],"answer":1,"explain":"Тримати язик за зубами — мовчати."}]},{"title":"Долина морфем","topic":"Будова слова","story":"Дорога веде до долини, де слова ростуть, немов рослини. Щоб зібрати п’яту печатку, треба розпізнати їхні корені, префікси, суфікси та закінчення.","questions":[{"q":"Яка частина слова виражає його граматичне значення і змінюється?","options":["корінь","суфікс","закінчення","префікс"],"answer":2,"explain":"Закінчення — змінна значуща частина слова."},{"q":"Яке слово має префікс?","options":["лісовий","підпис","лісник","весна"],"answer":1,"explain":"У слові підпис є префікс під-."},{"q":"Яке слово є спільнокореневим до «вода»?","options":["водій","водний","водити","проводити"],"answer":1,"explain":"Водний має спільний корінь і значення, пов’язане з водою."},{"q":"Яке слово має нульове закінчення?","options":["стіл","книга","море","земля"],"answer":0,"explain":"У формі стіл закінчення нульове."},{"q":"Яка частина слова стоїть перед коренем?","options":["закінчення","суфікс","префікс","основа"],"answer":2,"explain":"Префікс стоїть перед коренем."}]},{"title":"Майстерня нових слів","topic":"Словотвір","story":"У майстерні коваль слів виготовляє нові назви. Але його чарівні інструменти переплуталися. Допоможи відновити способи творення слів.","questions":[{"q":"Від якого слова утворено «лісник»?","options":["лісовий","ліс","лісничий","лісок"],"answer":1,"explain":"Лісник утворено від слова ліс."},{"q":"Яким способом утворено «підводний» від «водний»?","options":["суфіксальним","префіксальним","складанням основ","безафіксним"],"answer":1,"explain":"Додано префікс під-."},{"q":"У якому слові є суфікс -еньк-?","options":["маленький","малий","малюк","мало"],"answer":0,"explain":"У слові маленький є суфікс -еньк-."},{"q":"Яке слово утворено складанням основ?","options":["водограй","водний","водичка","підводний"],"answer":0,"explain":"Водограй утворено поєднанням основ."},{"q":"Яке слово утворено префіксально-суфіксальним способом від «берег»?","options":["бережок","прибережний","береги","береговий"],"answer":1,"explain":"Прибережний має префікс при- та суфікс -н-."}]},{"title":"Фортеця правопису","topic":"Орфографія","story":"Біля фортеці стоять вартові Орфограми. Кожна правильна літера піднімає міст і наближає експедицію до таємниці книги.","questions":[{"q":"Укажи правильно написане слово.","options":["безшумний","бесшумний","бешшумний","безшумнний"],"answer":0,"explain":"Правильно: безшумний."},{"q":"У якому слові треба писати апостроф?","options":["буряк","піря","свято","морквяний"],"answer":1,"explain":"Правильно: пір’я."},{"q":"Укажи правильно написане слово.","options":["прекрасний","прикрасний","прекраснний","прекрасс ний"],"answer":0,"explain":"Правильно: прекрасний."},{"q":"У якому слові пишемо м’який знак?","options":["кін","кінь","кінн","кинь"],"answer":1,"explain":"Правильно: кінь."},{"q":"Укажи правильно написане слово.","options":["зробити","сробити","ззробити","сзробити"],"answer":0,"explain":"Правильно: зробити."}]},{"title":"Палац іменників","topic":"Іменник","story":"У Палаці іменників двері мають назви відмінків, а сторожа запитує про рід і число. Знання допоможуть знайти прихований коридор.","questions":[{"q":"На яке питання відповідає іменник?","options":["який?","хто? що?","що робить?","як?"],"answer":1,"explain":"Іменник називає предмет і відповідає на хто? що?"},{"q":"Який іменник належить до жіночого роду?","options":["степ","ніч","море","батько"],"answer":1,"explain":"Ніч — іменник жіночого роду."},{"q":"У якому відмінку стоїть слово «книгою»?","options":["називному","родовому","орудному","місцевому"],"answer":2,"explain":"Ким? чим? — книгою, орудний відмінок."},{"q":"Який іменник уживається тільки в множині?","options":["ножиці","ліс","сонце","вікно"],"answer":0,"explain":"Ножиці — іменник, що має лише форму множини."},{"q":"Яке слово є власною назвою?","options":["річка","місто","Дніпро","гора"],"answer":2,"explain":"Дніпро — власна назва."}]},{"title":"Галерея прикметників","topic":"Прикметник","story":"У галереї зникли всі кольори. Повернути їх можуть лише прикметники, які точно називають ознаки предметів.","questions":[{"q":"На яке питання відповідає прикметник?","options":["скільки?","який?","що робити?","де?"],"answer":1,"explain":"Прикметник відповідає на який? яка? яке? які?"},{"q":"Який прикметник є якісним?","options":["дерев’яний","весняний","сміливий","материн"],"answer":2,"explain":"Сміливий — якісний прикметник."},{"q":"Який прикметник є відносним?","options":["веселий","залізний","найкращий","батьків"],"answer":1,"explain":"Залізний називає ознаку за матеріалом."},{"q":"Який прикметник є присвійним?","options":["лисячий","зелений","міський","теплий"],"answer":0,"explain":"Лисячий указує на належність лисиці."},{"q":"Яка форма є найвищим ступенем порівняння?","options":["високий","вищий","найвищий","дуже високий"],"answer":2,"explain":"Найвищий — форма найвищого ступеня."}]},{"title":"Вежа числівників","topic":"Числівник","story":"Висока вежа має сходи з чисел. Кожен щабель відкривається лише після правильної відповіді про кількість і порядок.","questions":[{"q":"Яке слово є числівником?","options":["трійка","три","потрійний","утрьох"],"answer":1,"explain":"Три — кількісний числівник."},{"q":"Який числівник є порядковим?","options":["сім","семеро","сьомий","сімка"],"answer":2,"explain":"Сьомий означає порядок під час лічби."},{"q":"Який числівник є збірним?","options":["двоє","два","другий","двійка"],"answer":0,"explain":"Двоє — збірний числівник."},{"q":"Укажи правильно написаний складний числівник.","options":["п’ятдесят","п’ятьдесят","пятдесят","п’ят десят"],"answer":0,"explain":"Правильно: п’ятдесят."},{"q":"У якому рядку обидва слова — числівники?","options":["шість, шостий","трійка, третій","двоє, удвох","п’ятий, п’ятірка"],"answer":0,"explain":"Шість — кількісний, шостий — порядковий числівник."}]},{"title":"Зала займенників","topic":"Займенник","story":"У залі дзеркал слова вміють указувати на предмети, ознаки й кількість, не називаючи їх. Щоб не заблукати, впізнай займенники.","questions":[{"q":"Яке слово є займенником?","options":["вони","книга","п’ять","червоний"],"answer":0,"explain":"Вони — особовий займенник."},{"q":"Який займенник є особовим?","options":["цей","ми","хтось","кожний"],"answer":1,"explain":"Ми — особовий займенник."},{"q":"Яке слово є присвійним займенником?","options":["мій","хто","цей","ніхто"],"answer":0,"explain":"Мій указує на належність."},{"q":"Укажи вказівний займенник.","options":["дехто","той","себе","вона"],"answer":1,"explain":"Той — вказівний займенник."},{"q":"У якому рядку всі слова — займенники?","options":["я, ти, ми","я, бігти, ми","цей, стіл, він","хто, третій, вона"],"answer":0,"explain":"Я, ти, ми — займенники."}]},{"title":"Скарбниця Королівської книги","topic":"Узагальнення","story":"Експедиція дісталася скарбниці. На п’єдесталі лежить порожня книга: її сторінки оживуть, якщо об’єднати знання всіх попередніх станцій.","questions":[{"q":"У якому рядку всі слова є іменниками?","options":["весна, школа, радість","гарний, весна, школа","три, школа, день","весело, радість, ліс"],"answer":0,"explain":"Усі три слова називають предмети або поняття."},{"q":"Яка пара є антонімами?","options":["добрий — лагідний","широкий — вузький","праця — робота","сміливий — хоробрий"],"answer":1,"explain":"Широкий — вузький."},{"q":"Який вислів означає «дуже швидко»?","options":["як черепаха","аж гай шумить","ні пари з уст","як кіт наплакав"],"answer":1,"explain":"«Аж гай шумить» може означати дуже швидко, інтенсивно."},{"q":"Яке слово утворено префіксальним способом від «писати»?","options":["писар","записати","письмо","писання"],"answer":1,"explain":"Записати утворено додаванням префікса за-."},{"q":"Яке слово є порядковим числівником?","options":["п’ять","п’ятірка","п’ятий","уп’ятьох"],"answer":2,"explain":"П’ятий — порядковий числівник."}]}]};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage='movosvit-rebuilt-'+"quest-6";
let state={done:[],current:0};try{let saved=JSON.parse(localStorage.getItem(storage));if(saved&&Array.isArray(saved.done))state=saved}catch(e){}
function save(){try{localStorage.setItem(storage,JSON.stringify(state))}catch(e){}}
function map(){ $('map').innerHTML=DATA.stages.map((s,i)=>`<button class="node ${state.done.includes(i)?'done':''} ${state.current===i?'active':''}" data-st="${i}" aria-label="Станція ${i+1}: ${esc(s.title)}">${state.done.includes(i)?'✓ ':''}${i+1}</button>`).join('');document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>show(+b.dataset.st));$('count').textContent=`${state.done.length} / 12`; $('bar').style.width=(state.done.length/12*100)+'%';}
function show(i){state.current=i;save();map();const s=DATA.stages[i];$('finish').classList.add('hidden');$('game').classList.remove('hidden');$('stationLabel').textContent=`СТАНЦІЯ ${i+1} / 12 · ${s.topic}`;$('stationTitle').textContent=s.title;$('stationImage').src=`images/station-${String(i+1).padStart(2,'0')}.webp`;$('stationImage').alt=`Кінематографічна ілюстрація до станції ${i+1}`;$('story').textContent=s.story;
const answers=Array(s.questions.length).fill(null);let checked=false;const box=$('questions');box.innerHTML='';s.questions.forEach((q,j)=>{let el=document.createElement('section');el.className='question';let order=q.options.map((_,k)=>k);for(let k=order.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}el.innerHTML=`<h3>${j+1}. ${esc(q.q)}</h3><div class="options"></div><div class="explain" aria-live="polite"></div>`;let options=el.querySelector('.options');order.forEach(k=>{let b=document.createElement('button');b.className='option';b.type='button';b.textContent=q.options[k];b.onclick=()=>{if(checked)return;answers[j]=k;options.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};b.dataset.idx=k;options.appendChild(b)});box.appendChild(el)});
$('feedback').innerHTML='';$('check').classList.remove('hidden');$('next').classList.add('hidden');$('check').onclick=()=>{if(answers.some(v=>v===null)){$('feedback').innerHTML='<div class="result bad">Дайте відповіді на всі запитання станції.</div>';return}let score=0;box.querySelectorAll('.question').forEach((el,j)=>{let q=s.questions[j];if(answers[j]===q.answer)score++;el.querySelectorAll('.option').forEach(b=>{let k=+b.dataset.idx;b.classList.toggle('correct',k===q.answer);b.classList.toggle('wrong',k===answers[j]&&k!==q.answer)});el.querySelector('.explain').textContent=q.explain});checked=true;if(score===s.questions.length){if(!state.done.includes(i))state.done.push(i);save();map();$('feedback').innerHTML='<div class="result">Усі відповіді правильні! Станцію пройдено.</div>';$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=i===11?'До підсумку':'Наступна станція';$('next').onclick=()=>i===11?finish():show(i+1)}else{$('feedback').innerHTML=`<div class="result bad">Правильних відповідей: ${score} із ${s.questions.length}. Прочитайте пояснення й повторіть станцію.</div>`;$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent='Спробувати ще раз';$('next').onclick=()=>show(i)}};window.scrollTo({top:0,behavior:'smooth'})}
function finish(){if(state.done.length!==12){show(DATA.stages.findIndex((_,i)=>!state.done.includes(i)));return}$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('finishedTitle').textContent=DATA.name;$('finishedText').textContent='Усі 12 станцій успішно пройдено. Вітаємо з перемогою!';window.scrollTo({top:0,behavior:'smooth'})}
$('start').onclick=()=>show(0);$('print').onclick=()=>window.print();$('reset').onclick=()=>{if(confirm('Скинути прогрес усіх станцій?')){state={done:[],current:0};save();map();show(0)}};map();if(state.done.length===12)finish();else show(state.current>=0&&state.current<12?state.current:0);
</script></body></html>
