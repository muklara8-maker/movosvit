-wrap:wrap;margin:14px 0}.link{text-decoration:none;display:inline-block}footer{text-align:center;color:#d0b87d;padding:30px}@media(max-width:600px){.hero{padding:30px 18px}iframe{height:520px}}</style></head><body><header><a href="../">✦ МОВОСВІТ · На головну</a></header><main class="wrap"><section class="hero"><h1>🎮 Інтерактивні ігри LearningApps</h1><p>Мовні пригоди, синтаксичні випробування та інтерактивні вправи для 5–9 класів.</p></section><div class="filters" id="filters"></div><div class="grid" id="list"></div><section id="player" hidden><h2 id="title"></h2><div class="actions"><button id="back">← До всіх ігор</button><a id="external" class="link" target="_blank" rel="noopener noreferrer">Відкрити вправу в новій вкладці ↗</a></div><iframe id="frame" title="Інтерактивна вправа LearningApps" allowfullscreen loading="lazy"></iframe></section></main><footer>МОВОСВІТ · Інтерактивна ігротека</footer><script>const games=[{"id": "56464092", "grade": 5, "topic": "Лексикологія", "title": "Лексичний детектив: знайди мовну пару", "description": "Знайди відповідні мовні пари."}, {"id": "56465942", "grade": 5, "topic": "Лексикологія", "title": "Мовні скарбниці: розподіли слова", "description": "Розподіли синоніми, антоніми й омоніми."}, {"id": "56465705", "grade": 6, "topic": "Фразеологія", "title": "Фразеологічний детектив: розкрий таємницю вислову", "description": "Досліджуй значення фразеологізмів."}, {"id": "56466137", "grade": 6, "topic": "Будова слова", "title": "Будова слова: морфемний конструктор", "description": "Повтори будову слова та морфеми."}, {"id": "56466394", "grade": 7, "topic": "Дієслово", "title": "Дієслівний лабіринт: три брами часу", "description": "Повтори часи дієслова."}, {"id": "56467513", "grade": 8, "topic": "Синтаксис", "title": "Синтаксичний мільйонер: шлях до мовного скарбу", "description": "Пройди 12 синтаксичних випробувань."}, {"id": "56468613", "grade": 8, "topic": "Синтаксис", "title": "Синтаксичний мільйонер — 2", "description": "Ще одне синтаксичне випробування у форматі гри «Мільйонер»."}, {"id": "56467809", "grade": 9, "topic": "Синтаксис", "title": "Складне речення: синтаксичний лабіринт", "description": "Знайди пари складних речень та їхніх характеристик."}];let grade=0;const $=s=>document.querySelector(s);function draw(){$('#filters').innerHTML=[0,5,6,7,8,9].map(n=>`<button aria-pressed="${n===grade}" data-grade="${n}">${n?n+' клас':'Усі класи'}</button>`).join('');$('#list').innerHTML=games.filter(g=>!grade||g.grade===grade).map(g=>`<article class="card"><span class="tag">${g.grade} клас · ${g.topic}</span><h2>${g.title}</h2><p>${g.description}</p><button data-id="${g.id}">▶ Розпочати вправу</button></article>`).join('')||'<p>Вправи для цього класу готуються.</p>'}function close(){ $('#frame').removeAttribute('src');$('#player').hidden=true;$('#list').hidden=false}$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-grade]');if(!b)return;grade=Number(b.dataset.grade);close();draw()});$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const g=games.find(x=>x.id===b.dataset.id);if(!g)return;const u='https://learningapps.org/watch?app='+g.id;$('#title').textContent=g.title;$('#frame').src=u;$('#external').href=u;$('#list').hidden=true;$('#player').hidden=false;$('#player').scrollIntoView({behavior:'smooth'})});$('#back').addEventListener('click',()=>{close();$('#list').scrollIntoView({behavior:'smooth'})});draw();</script></body></html>
